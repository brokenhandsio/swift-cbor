name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run the (otherwise opt-in) deep generative fuzz pass in every test job.
  CBOR_FUZZ_DEEP: "1"
  # The TEST_RUNNER_-prefixed variant is forwarded (prefix stripped) into the
  # iOS test runner process by xcodebuild.
  TEST_RUNNER_CBOR_FUZZ_DEEP: "1"

jobs:
  macos-test:
    name: Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios-test:
    name: Test (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test
        # SwiftPM generates a single scheme named after the package.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swift-cbor \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'

  linux-test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux-test-no-foundation:
    name: Test (Linux, FoundationSupport disabled)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      # Guards against re-introducing a hard Foundation dependency in the core
      # library. The Data-specific Codable test compiles out under this trait.
      - name: Build (traits disabled)
        run: swift build --disable-default-traits
      - name: Test (traits disabled)
        run: swift test --disable-default-traits

  # Foundation is meant to be optional here, and "optional" has two halves that
  # need checking separately.
  #
  # `linux-test-no-foundation` above proves the library *compiles* with the
  # trait off. It cannot prove nothing *links* Foundation — a compile-only check
  # passes happily while some path still drags the library in. So this builds a
  # throwaway executable against the CBOR product and asks `ldd` what actually
  # came along, in both configurations:
  #
  #   trait enabled  — FoundationEssentials is expected and fine; full
  #                    Foundation and the ICU libraries are not.
  #   trait disabled — nothing Foundation-family at all.
  #
  # Adapted from vapor/ci's check-foundation-linking.yml, which cannot be reused
  # directly because it has no way to select package traits.
  foundation-linking:
    name: Foundation linking (${{ matrix.config }})
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: default traits
            traits: ""
          - config: traits disabled
            traits: ", traits: []"
    steps:
      - uses: actions/checkout@v7

      - name: Build a check executable and inspect its linkage
        run: |
          set -uo pipefail
          fatal() { echo "::error::$*"; exit 1; }

          shim="$(mktemp -d)"
          mkdir -p "$shim/Sources/check"
          touch "$shim/Sources/check/main.swift"
          cat > "$shim/Package.swift" <<EOF
          // swift-tools-version: 6.3
          import PackageDescription
          let package = Package(
              name: "check",
              dependencies: [.package(name: "swift-cbor", path: "$GITHUB_WORKSPACE"${{ matrix.traits }})],
              targets: [.executableTarget(name: "check", dependencies: [.product(name: "CBOR", package: "swift-cbor")])]
          )
          EOF

          swift build --package-path "$shim" -c release || fatal "the check executable did not build"
          binary="$(swift build --package-path "$shim" -c release --show-bin-path)/check"
          # Without this, a failed build leaves ldd with nothing to inspect, no
          # library names to match, and the loop below reports a clean pass.
          [ -f "$binary" ] || fatal "$binary does not exist, so nothing was checked"

          linked="$(ldd "$binary" | awk '{print $1}' | grep -iE 'foundation|icu')"
          echo "Foundation-family libraries linked: ${linked:-(none)}"

          found=0
          for lib in libFoundation.so libFoundationInternationalization.so lib_FoundationICU.so; do
            if echo "$linked" | grep -qx "$lib"; then
              echo "::error::$lib is linked"
              found=1
            fi
          done
          [ "$found" -eq 0 ] || fatal "full Foundation or ICU is linked"
          echo "No full Foundation or ICU linked."

  linux-benchmark:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    env:
      CBOR_BENCHMARK: "1" # wire up the (otherwise-gated) benchmark target
    steps:
      - uses: actions/checkout@v7
      - name: Run benchmarks
        run: swift package --disable-sandbox benchmark

  docs:
    name: DocC archive
    runs-on: ubuntu-latest
    container: swift:6.3
    env:
      CBOR_DOCC: "1" # wire up the (otherwise-gated) swift-docc-plugin
    steps:
      - uses: actions/checkout@v7
      - name: Build documentation archive
        run: swift package generate-documentation --target CBOR
      - name: Package archive
        # DocC output contains files with ':' in their names (e.g. operator pages),
        # which upload-artifact rejects. Tar the archive into a single file first.
        run: tar -C .build/plugins/Swift-DocC/outputs -czf CBOR.doccarchive.tgz CBOR.doccarchive
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: CBOR-doccarchive
          path: CBOR.doccarchive.tgz
