# The nightly soak. The replay gate, which builds every target and re-runs the
# committed corpus and saved crashes, is the `fuzz-replay` job in ci.yml.
#
# GitHub switches this workflow off after 60 days without repository activity,
# because it has a schedule, and it stays off until someone turns it back on:
#
#   gh workflow enable fuzz.yml
#
# That is why nothing that gates a pull request lives here any more.
name: Fuzz

# Every job here only reads the repository. Without this the token gets the
# organization's default, which is read and write.
permissions:
  contents: read

on:
  schedule:
    # 03:17 UTC daily. Off the hour to avoid GitHub's scheduler backlog.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Soak duration per target, in seconds"
        default: "600"

jobs:
  # The job that actually finds things.
  soak:
    name: Soak (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: swift:6.3
    # Comfortably above the soak duration: the instrumented build has to happen
    # first, and a crash triggers minimization-free but non-instant teardown.
    timeout-minutes: 45
    strategy:
      # One target crashing must not cancel the others' search.
      fail-fast: false
      matrix:
        include:
          - target: CBORDecode
            args: ""
          - target: CBORRoundTrip
            args: ""
          - target: CBORDeepNesting
            args: "-max_len=65536"
          - target: CBORDeepMapKeys
            args: ""
          # Two control values off the back, the rest passed through as
          # ordinary CBOR, so libFuzzer's default length limit is fine.
          - target: CBORDecodingOptions
            args: ""
          # Asserts decodeFirst never reports consuming more than it was given —
          # a property swift-webauthn's bounds arithmetic silently depends on.
          - target: CBORDecodeFirst
            args: ""
          # The Codable bridge, which no other target reaches: they all enter
          # through the parser.
          - target: CBORCodable
            args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Fuzz
        working-directory: Fuzzing
        run: |
          swift package --allow-writing-to-package-directory \
            fuzz ${{ matrix.target }} \
            --time ${{ github.event.inputs.seconds || '600' }} ${{ matrix.args }}

      # The container is discarded when the job ends, so a crashing input that
      # is not uploaded is lost and the finding is unreproducible.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ matrix.target }}
          path: Fuzzing/Crashes/${{ matrix.target }}/
          if-no-files-found: ignore

      # Whatever new coverage the soak found. Not committed automatically: the
      # working corpus is mostly redundant and wants `-merge=1` first. Download,
      # minimize locally, commit. See swift-fuzz's README, "Corpus hygiene".
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: Fuzzing/Corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
